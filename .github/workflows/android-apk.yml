name: Build PFLS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signing key
        if: ${{ secrets.PFLS_KEYSTORE_BASE64 != '' && secrets.PFLS_KEYSTORE_PASSWORD != '' && secrets.PFLS_KEY_ALIAS != '' && secrets.PFLS_KEY_PASSWORD != '' }}
        env:
          PFLS_KEYSTORE_BASE64: ${{ secrets.PFLS_KEYSTORE_BASE64 }}
        run: echo "$PFLS_KEYSTORE_BASE64" | base64 --decode > android/pfls-release.jks
      - name: Build signed release APK
        if: ${{ secrets.PFLS_KEYSTORE_BASE64 != '' && secrets.PFLS_KEYSTORE_PASSWORD != '' && secrets.PFLS_KEY_ALIAS != '' && secrets.PFLS_KEY_PASSWORD != '' }}
        working-directory: android
        env:
          PFLS_KEYSTORE_PASSWORD: ${{ secrets.PFLS_KEYSTORE_PASSWORD }}
          PFLS_KEY_ALIAS: ${{ secrets.PFLS_KEY_ALIAS }}
          PFLS_KEY_PASSWORD: ${{ secrets.PFLS_KEY_PASSWORD }}
          KEYSTORE_FILE: pfls-release.jks
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease
      - name: Build debug APK (first test only; not suitable for seamless updates)
        if: ${{ secrets.PFLS_KEYSTORE_BASE64 == '' || secrets.PFLS_KEYSTORE_PASSWORD == '' || secrets.PFLS_KEY_ALIAS == '' || secrets.PFLS_KEY_PASSWORD == '' }}
        working-directory: android
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle assembleDebug
      - name: Select APK
        id: apk
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "path=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "name=PFLS-Predictor-${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"
          else
            echo "path=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "name=PFLS-Predictor-debug-${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PFLS-Predictor-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
      - name: Publish GitHub release
        if: ${{ secrets.PFLS_KEYSTORE_BASE64 != '' && secrets.PFLS_KEYSTORE_PASSWORD != '' && secrets.PFLS_KEY_ALIAS != '' && secrets.PFLS_KEY_PASSWORD != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PFLS Predictor v1.0.${{ github.run_number }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
