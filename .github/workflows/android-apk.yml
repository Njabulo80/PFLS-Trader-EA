name: Build PFLS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # GitHub does not allow the secrets context directly in an if: expression.
      # Check secret availability in a normal step and expose only a boolean output.
      - name: Check release signing configuration
        id: signing
        shell: bash
        env:
          PFLS_KEYSTORE_BASE64: ${{ secrets.PFLS_KEYSTORE_BASE64 }}
          PFLS_KEYSTORE_PASSWORD: ${{ secrets.PFLS_KEYSTORE_PASSWORD }}
          PFLS_KEY_ALIAS: ${{ secrets.PFLS_KEY_ALIAS }}
          PFLS_KEY_PASSWORD: ${{ secrets.PFLS_KEY_PASSWORD }}
        run: |
          if [[ -n "$PFLS_KEYSTORE_BASE64" && -n "$PFLS_KEYSTORE_PASSWORD" && -n "$PFLS_KEY_ALIAS" && -n "$PFLS_KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare signing key
        if: steps.signing.outputs.ready == 'true'
        env:
          PFLS_KEYSTORE_BASE64: ${{ secrets.PFLS_KEYSTORE_BASE64 }}
        run: |
          echo "$PFLS_KEYSTORE_BASE64" | base64 --decode > android/pfls-release.jks

      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          PFLS_KEYSTORE_BASE64: ${{ secrets.PFLS_KEYSTORE_BASE64 }}
          PFLS_KEYSTORE_PASSWORD: ${{ secrets.PFLS_KEYSTORE_PASSWORD }}
          PFLS_KEY_ALIAS: ${{ secrets.PFLS_KEY_ALIAS }}
          PFLS_KEY_PASSWORD: ${{ secrets.PFLS_KEY_PASSWORD }}
          KEYSTORE_FILE: pfls-release.jks
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease

      - name: Build debug APK (first test only; not suitable for seamless updates)
        if: steps.signing.outputs.ready != 'true'
        working-directory: android
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle assembleDebug

      - name: Select APK
        id: apk
        shell: bash
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "path=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "path=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PFLS-Predictor-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publish signed GitHub release
        if: steps.signing.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PFLS Predictor v1.0.${{ github.run_number }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
